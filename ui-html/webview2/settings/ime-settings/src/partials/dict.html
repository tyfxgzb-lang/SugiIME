<div class="content" id="dict-settings">
  <div class="content-header"><span data-i18n="dict.title">词库</span></div>
  <div class="dict-card">
    <div class="dict-tabs" role="tablist">
      <button class="dict-tab" data-dictionary="english" data-i18n="dict.tabEnglish">英文词库</button>
      <button class="dict-tab active" data-dictionary="japanese" data-i18n="dict.tabJapanese">日语词库</button>
    </div>
    <div class="dict-toolbar">
      <input id="dictSearch" class="dict-input" placeholder="输入全拼后查询，例如 nihao" spellcheck="false">
      <button id="dictSearchButton" class="dict-button secondary" data-i18n="common.search">查询</button>
      <button id="dictImportButton" class="dict-button secondary" data-i18n="common.import">批量导入</button>
      <button id="dictAddButton" class="dict-button primary" data-i18n="common.add">新增词条</button>
      <input id="dictImportFile" type="file" accept=".txt,.yaml,.yml,.csv,.tsv,.dic,text/plain" hidden>
    </div>
    <div class="dict-hint" id="dictHint" data-i18n="dict.hint">输入完整拼音查询，最多显示 100 条结果</div>
    <div id="dictTableHeaderWrap" class="dict-table-header-wrap">
      <table class="dict-table"><thead><tr id="dictTableHeader"><th class="dict-index-column">No.</th><th data-i18n="dict.headerCode">拼音</th><th data-i18n="dict.headerWord">词条</th><th data-i18n="dict.headerWeight">权重</th><th data-i18n="dict.headerOperation">操作</th></tr></thead></table>
    </div>
    <div class="dict-table-wrap">
      <table class="dict-table">
        <tbody id="dictRows"><tr><td colspan="5" class="dict-empty" data-i18n="dict.empty">输入查询条件后查看词条</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section dict-export-section">
    <div class="section-title dict-export-title" data-i18n="dict.exportTitle">导出词库</div>
    <div class="dict-export-row">
      <span data-i18n="dict.exportEnglish">导出英文用户词库</span>
      <button class="dict-button primary" type="button" data-export-dictionary="english" data-i18n="common.export">导出</button>
    </div>
  </div>

  <div id="dictModal" class="dict-modal" aria-hidden="true">
    <div class="dict-dialog" role="dialog" aria-modal="true">
      <div class="dict-dialog-title" id="dictDialogTitle" data-i18n="dict.modalAddTitle">新增词条</div>
      <label id="dictCodeField"><span data-i18n="dict.modalCode">编码</span><input id="dictCode" class="dict-input" spellcheck="false"></label>
      <label id="dictWordField"><span data-i18n="dict.modalWord">词条</span><input id="dictWord" class="dict-input" spellcheck="false"></label>
      <label id="dictWeightField"><span data-i18n="dict.modalWeight">权重</span><input id="dictWeight" class="dict-input" type="number" min="0"></label>
      <div class="dict-dialog-actions">
        <button id="dictCancelButton" class="dict-button secondary" data-i18n="common.cancel">取消</button>
        <button id="dictSaveButton" class="dict-button primary" data-i18n="common.save">保存</button>
      </div>
    </div>
  </div>
  <div id="dictToast" class="dict-toast" role="status" aria-live="polite">
    <div id="dictToastIcon" class="dict-toast-icon" aria-hidden="true"></div>
    <div id="dictToastMessage" class="dict-toast-message"></div>
    <button id="dictToastClose" class="dict-toast-close" type="button" aria-label="关闭通知" data-i18n-attr="aria-label:common.closeNotification">×</button>
  </div>
</div>
