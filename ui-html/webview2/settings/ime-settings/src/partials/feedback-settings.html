<div class="content document-page">
  <div class="content-header"><span data-i18n="feedback.title">反馈</span></div>

  <div class="section document-hero">

    <p data-i18n="feedback.intro">遇到问题或有功能建议时，可以通过以下渠道提交和交流。</p>

  <div class="feedback-list">
    <div class="section feedback-card">

      <button type="button" class="feedback-action" data-open-url="https://github.com/tyfxgzb-lang/SugiIME/issues" data-i18n="feedback.issuesBtn">查看 Issues</button>

    <div class="section feedback-card">
      <div class="feedback-icon">QQ</div><div class="feedback-body"><div class="feedback-title" data-i18n="feedback.qqTitle">QQ 交流群</div>
      <p data-i18n="feedback.qqDesc">适合中文用户进行日常交流、测试反馈和使用讨论。</p><code data-i18n="feedback.qqGroup">群号：829919142</code></div>
      <button type="button" class="feedback-action" data-copy-text="829919142" data-i18n="feedback.qqCopy">复制群号</button>
    </div>
    <div class="section feedback-card">
      <div class="feedback-icon">TG</div><div class="feedback-body"><div class="feedback-title" data-i18n="feedback.tgTitle">Telegram 群组</div>

      <button type="button" class="feedback-action" data-open-url="https://t.me/msimegroup" data-i18n="feedback.tgBtn">打开群组</button>
    </div>
  </div>

  <div class="section document-note"><strong data-i18n="feedback.tip">提交问题时建议附上：系统版本、输入方案、复现步骤、相关截图，以及 Debug 输出中的关键日志。</strong></div>
</div>
